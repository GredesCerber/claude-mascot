name: Rust Windows release

on:
  push:
    tags:
      - "rust-v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing rust-vX.Y.Z tag to build or recover an unpublished draft
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: rust-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      MASCOT_UPDATE_REPO: ${{ github.repository }}
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Require a version-matched release tag
        shell: pwsh
        working-directory: rust
        run: |
          $metadata = cargo metadata --format-version 1 --no-deps | ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq 'claude-mascot' } | Select-Object -First 1
          if ($null -eq $package) { throw 'claude-mascot package is missing from Cargo metadata' }
          $expected = "rust-v$($package.version)"
          if ($env:RELEASE_TAG -ne $expected) {
            throw "Release tag '$env:RELEASE_TAG' is not the version tag '$expected'."
          }
      - name: Check formatting
        run: cargo fmt --all -- --check
        working-directory: rust
      - name: Test
        run: cargo test --locked
        working-directory: rust
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: rust
      - name: Build Windows x64 executable
        run: cargo build --locked --release --target x86_64-pc-windows-msvc
        working-directory: rust
      - name: Build per-user MSI
        shell: pwsh
        run: |
          ./rust/tools/Set-ExecutableIcon.ps1 -InputExe 'rust/target/x86_64-pc-windows-msvc/release/claude-mascot.exe' -IconPath 'rust/assets/claude-icon.ico'
          dotnet tool install --global wix --version 6.0.2
          if ($LASTEXITCODE) { throw 'WiX installation failed' }
          ./rust/Build-Msi.ps1 -ExecutablePath "$env:GITHUB_WORKSPACE/rust/target/x86_64-pc-windows-msvc/release/claude-mascot.exe" -OutputDirectory "$env:RUNNER_TEMP/mascot-release"
      - name: Validate MSI database
        shell: pwsh
        run: |
          $msi = Get-ChildItem "$env:RUNNER_TEMP/mascot-release" -Filter *.msi | Select-Object -First 1
          wix msi validate $msi.FullName
          if ($LASTEXITCODE) { throw "MSI validation failed" }
      - name: Package executable and SHA-256 manifest
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP 'mascot-release'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          $builtExe = 'rust/target/x86_64-pc-windows-msvc/release/claude-mascot.exe'
          $exe = Join-Path $dist 'claude-mascot-windows-x64.exe'
          Copy-Item $builtExe $exe
          $portable = Join-Path $dist 'portable'
          New-Item -ItemType Directory -Path $portable -Force | Out-Null
          Copy-Item $builtExe (Join-Path $portable 'claude-mascot.exe')
          Copy-Item 'rust/README.md' (Join-Path $portable 'README.md')
          Copy-Item 'rust/Install.ps1' $portable
          Copy-Item 'rust/Uninstall.ps1' $portable
          $docs = Join-Path $portable 'docs'
          New-Item -ItemType Directory -Path $docs -Force | Out-Null
          Get-ChildItem 'rust/docs' | Copy-Item -Destination $docs -Recurse
          $zip = Join-Path $dist 'claude-mascot-windows-x64.zip'
          Compress-Archive -Path (Join-Path $portable '*') -DestinationPath $zip
          $version = (Get-Content rust/Cargo.toml | Select-String '^version = "(.+)"$').Matches.Groups[1].Value
          Copy-Item "rust/docs/releases/$version.md" (Join-Path $dist 'RELEASE-NOTES.md')
          $lines = @(
            "$( (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant() )  $(Split-Path -Leaf $exe)",
            "$( (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant() )  $(Split-Path -Leaf $zip)"
          )
          Get-ChildItem $dist -Filter '*.msi' | ForEach-Object {
            $lines += "$( (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant() )  $($_.Name)"
          }
          Set-Content -Path (Join-Path $dist 'SHA256SUMS') -Value $lines -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: rust-windows-x64-release
          path: |
            ${{ runner.temp }}/mascot-release/*.exe
            ${{ runner.temp }}/mascot-release/*.zip
            ${{ runner.temp }}/mascot-release/*.msi
            ${{ runner.temp }}/mascot-release/SHA256SUMS
            ${{ runner.temp }}/mascot-release/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rust-windows-x64-release
          path: release-assets
      - name: Publish verified release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^rust-v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tag '$env:RELEASE_TAG' is not a semantic rust-v tag."
          }
          $existingJson = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json apiUrl,isDraft,isPrerelease,tagName 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            if (!$existing.isDraft -or $existing.isPrerelease -or $existing.tagName -ne $env:RELEASE_TAG) {
              throw 'Refusing to change an already published release or a different tag.'
            }
            gh release upload $env:RELEASE_TAG `
              release-assets/claude-mascot-windows-x64.exe `
              release-assets/claude-mascot-windows-x64.zip `
              release-assets/*.msi `
              release-assets/SHA256SUMS `
              --clobber --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE) { throw 'Draft asset recovery failed.' }
          } else {
            gh release create $env:RELEASE_TAG `
              release-assets/claude-mascot-windows-x64.exe `
              release-assets/claude-mascot-windows-x64.zip `
              release-assets/*.msi `
              release-assets/SHA256SUMS `
              --draft --verify-tag --repo $env:GITHUB_REPOSITORY `
              --title "Claude Mascot $($env:RELEASE_TAG)" `
              --notes-file release-assets/RELEASE-NOTES.md
            if ($LASTEXITCODE) { throw 'Draft release creation failed.' }
          }
          $releaseApi = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json apiUrl --jq .apiUrl
          if ($LASTEXITCODE) { throw 'Cannot locate the draft release API URL.' }
          $release = gh api $releaseApi | ConvertFrom-Json
          if ($LASTEXITCODE -or !$release.draft -or $release.prerelease -or $release.tag_name -ne $env:RELEASE_TAG) {
            throw 'Expected a stable draft release matching the requested tag.'
          }
          foreach ($line in Get-Content release-assets/SHA256SUMS) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw 'Invalid SHA256SUMS line.' }
            $digest = 'sha256:' + $Matches[1]
            $name = $Matches[2]
            $assets = @($release.assets | Where-Object name -eq $name)
            if ($assets.Count -ne 1 -or $assets[0].digest -ne $digest) {
              throw "GitHub asset digest mismatch: $name"
            }
          }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE) { throw 'Release publication failed.' }
